services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skilltrack
      POSTGRES_USER: skilltrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skilltrack -d skilltrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://skilltrack:${POSTGRES_PASSWORD}@db:5432/skilltrack
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in the deployment environment}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the public frontend origin}
      APP_ENV: production
      UPLOAD_DIR: /data/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      RATE_LIMIT_REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - resume-data:/data/uploads
      - recommender-data:/app/app/ml/artifacts
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend/my-application
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres-data:
  resume-data:
  recommender-data:
